<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Погода в горах и на море — Красная Поляна</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="home-screen">
    <header class="hero">
      <svg class="hero-mountains" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="sk0"/><stop offset="1" class="sk1"/>
          </linearGradient>
        </defs>
        <rect width="400" height="160" fill="url(#sky)"/>
        <g id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" role="button" aria-label="Переключить тему">
          <g class="moon-g">
            <path d="M302 48 A16 16 0 0 1 302 80 A17.14 17.14 0 0 0 302 48 Z" fill="#e8f4f8" opacity="0.92" transform="rotate(30 302 64)"/>
          </g>
          <g class="sun-g">
            <circle cx="302" cy="64" r="10" fill="#ffd166"/>
            <g stroke="#ffd166" stroke-width="2.2" stroke-linecap="round">
              <line x1="315" y1="64" x2="319.5" y2="64"/>
              <line x1="311.2" y1="73.2" x2="314.4" y2="76.4"/>
              <line x1="302" y1="77" x2="302" y2="81.5"/>
              <line x1="292.8" y1="73.2" x2="289.6" y2="76.4"/>
              <line x1="289" y1="64" x2="284.5" y2="64"/>
              <line x1="292.8" y1="54.8" x2="289.6" y2="51.6"/>
              <line x1="302" y1="51" x2="302" y2="46.5"/>
              <line x1="311.2" y1="54.8" x2="314.4" y2="51.6"/>
            </g>
          </g>
          <circle cx="302" cy="64" r="26" fill="transparent"/>
        </g>
        <path d="M0 160 L60 84 L95 122 L150 52 L205 128 L245 88 L300 140 L340 100 L400 160 Z" class="mt1"/>
        <path d="M150 52 L168 74 L158 70 L150 80 L141 68 L134 74 Z" class="snow"/>
        <path d="M60 84 L74 102 L64 98 L56 106 L49 96 L44 100 Z" class="snow snow2"/>
        <path d="M0 160 L80 108 L140 150 L210 96 L280 152 L330 122 L400 160 Z" class="mt2"/>
        <path d="M0 160 L120 132 L220 160 L320 138 L400 160 Z" class="mt3"/>
      </svg>
      <div class="hero-text">
        <h1>Погода в горах и на море</h1>
        <p>Красная Поляна · Сочи · Абхазия · и весь Мир <button class="globe-btn" onclick="openLibrary()" aria-label="Библиотека точек">🌍</button></p>
      </div>
    </header>
    <main id="points-list" class="points-list">
      <div class="loading">Загружаю точки…</div>
    </main>
    <section id="home-panels" class="panels"></section>
    <footer class="foot">Данные: Open-Meteo · MET Norway · кэш 30 мин</footer>
  </div>

  <div id="point-screen" class="hidden">
    <div class="sticky-head">
      <button class="back-btn" onclick="goHome()">← Все точки</button>
      <span class="sticky-name" id="sticky-name"></span>
    </div>
    <div id="point-content"></div>
    <section id="point-panels" class="panels"></section>
  </div>

  <div id="lib-screen" class="lib-overlay hidden">
    <div class="lib-head">
      <input id="lib-search" class="lib-search" placeholder="Поиск точки…" oninput="renderLibrary(this.value)">
      <button class="lib-close" onclick="closeLibrary()" aria-label="Закрыть">✕</button>
    </div>
    <div id="lib-list" class="lib-list"></div>
  </div>

  <div id="fb-modal" class="fb-modal hidden" onclick="if(event.target===this)closeFeedback()">
    <div class="fb-card">
      <div class="fb-title">Предложить точку</div>
      <div class="fb-text">Пришлите в чат бота название и координаты точки.<br><br>Пример:<br><b>Озеро Рица — 43.472, 40.534</b><br><br>Точка появится в библиотеке в течение ~24 часов.</div>
      <button class="fb-go" onclick="feedbackGo()">Открыть чат @broKimibot</button>
      <button class="fb-cancel" onclick="closeFeedback()">Отмена</button>
    </div>
  </div>
</div>
<script src="weather.js"></script>
<script src="app.js"></script>
</body>
</html>
