name: Приём точек из бота

on:
  schedule:
    - cron: "17 3 * * *" # ежедневно 06:17 МСК
  workflow_dispatch:      # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Читаем сообщения бота и обновляем pending.json
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 tools/intake_points.py

      - name: Коммитим очередь модерации, если есть изменения
        run: |
          git config user.name "kp-weather-bot"
          git config user.email "kp-weather-bot@users.noreply.github.com"
          git add data/pending.json data/intake_state.json
          git diff --cached --quiet || git commit -m "intake: новые предложенные точки"
          git push
