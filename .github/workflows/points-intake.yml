name: Приём точек из бота

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # каждые 15 минут (UTC), минуты смещены от :00/:30 против очередей
  workflow_dispatch:      # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Диагностика: какой бот за токеном (временный шаг)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python3 -c "
          import json, os, urllib.request
          r = json.loads(urllib.request.urlopen('https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/getMe', timeout=15).read())
          b = r.get('result', {})
          print('BOT IS:', b.get('username'), '|', b.get('first_name'), '| id', b.get('id'))
          "

      - name: Читаем сообщения бота и обновляем points.json
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 tools/intake_points.py

      - name: Коммитим новые точки, если есть изменения
        run: |
          git config user.name "kp-weather-bot"
          git config user.email "kp-weather-bot@users.noreply.github.com"
          git add data/points.json data/intake_state.json data/admins.json
          git pull --rebase --autostash origin main
          git diff --cached --quiet || git commit -m "intake: авто-приём точек"
          git push
