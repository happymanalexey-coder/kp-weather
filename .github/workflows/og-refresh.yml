name: OG-страницы точек (ежедневно)

on:
  schedule:
    - cron: "41 3 * * *" # раз в сутки (UTC) — консенсус в og:title живёт один день
  workflow_dispatch:      # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  og-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Пересчитываем консенсус и перегенерируем point/<id>/
        run: node tools/gen_point_pages.mjs

      - name: Коммитим свежие OG-страницы, если есть изменения
        run: |
          git config user.name "kp-weather-bot"
          git config user.email "kp-weather-bot@users.noreply.github.com"
          git add point/
          git pull --rebase --autostash origin main
          git diff --cached --quiet || git commit -m "og: ежедневная регенерация страниц точек"
          git push
